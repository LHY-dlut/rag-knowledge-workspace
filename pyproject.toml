[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform-reproduction"
version = "0.1.0"
description = "图文驱动的高级 RAG 平台独立复现"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "pydantic==2.13.5",
  "pydantic-settings==2.15.0", "tortoise-orm[asyncmy,asyncpg]==1.1.8",
  "PyJWT==2.15.1", "argon2-cffi==25.1.0", "sse-starlette==3.5.0",
  "httpx[socks]==0.28.1", "langgraph==1.2.12", "langchain-core==1.6.6", "python-multipart==0.0.32",
  "jieba==0.42.1", "rank-bm25==0.2.2", "pymupdf==1.28.2",
  "pdfplumber==0.11.10", "python-docx==1.2.0", "openpyxl==3.1.5",
  "tzdata==2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]
ocr = ["rapidocr-onnxruntime>=1.4,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires MySQL and PostgreSQL"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.tortoise]
tortoise_orm = "app.database.TORTOISE_ORM"
